name: Blast Radius PR Analysis

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  analyze_blast_radius:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Get PR Diff
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > pr.diff
          echo "diff_path=pr.diff" >> $GITHUB_ENV

      - name: Start Blast Radius API
        run: |
          pip install -r requirements.txt
          nohup uvicorn blast_radius.api.main:app --port 8000 &
          sleep 5

      - name: Run Impact Analysis
        id: analysis
        run: |
          # Read diff content and properly escape for JSON
          DIFF_CONTENT=$(cat pr.diff | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          
          # Call API
          RESPONSE=$(curl -s -X POST http://localhost:8000/analyze \
            -H "Content-Type: application/json" \
            -d "{\"diff\": $DIFF_CONTENT, \"repo_path\": \"seed/\"}")
          
          echo "response=$RESPONSE" >> $GITHUB_ENV
          
          # Extract specific fields using jq
          SCORE=$(echo $RESPONSE | jq -r '.risk_score')
          BAND=$(echo $RESPONSE | jq -r '.risk_band')
          EXPL=$(echo $RESPONSE | jq -r '.explanation')
          TEAMS=$(echo $RESPONSE | jq -r '.affected_teams | join(", ")')
          TESTS=$(echo $RESPONSE | jq -r '.recommended_tests | join(" \n- ")')
          
          echo "RISK_SCORE=$SCORE" >> $GITHUB_ENV
          echo "RISK_BAND=$BAND" >> $GITHUB_ENV
          echo "EXPLANATION=$EXPL" >> $GITHUB_ENV
          echo "TEAMS=$TEAMS" >> $GITHUB_ENV
          echo "TESTS=$TESTS" >> $GITHUB_ENV

      - name: Post PR Comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const risk_band = process.env.RISK_BAND;
            const emoji = risk_band === 'HIGH' ? '🚨' : risk_band === 'MEDIUM' ? '⚠️' : '✅';
            
            const body = `
            ## 💥 Blast Radius Impact Analysis
            
            **Risk Level:** ${emoji} **${risk_band}** (Score: ${process.env.RISK_SCORE}/100)
            
            **Explanation:**
            > ${process.env.EXPLANATION}
            
            **Affected Teams:**
            ${process.env.TEAMS ? process.env.TEAMS : 'None detected'}
            
            **Recommended Tests to Run:**
            ${process.env.TESTS ? '- ' + process.env.TESTS : 'None required'}
            
            _Generated by the CodeHunters Validation Agent_
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
